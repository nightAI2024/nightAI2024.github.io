<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAIO 원우회 - 회원 검증</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#0f62fe" },
                    fontFamily: { display: ["Noto Sans KR", "Inter", "sans-serif"] },
                    borderRadius: { xl: "1rem", "2xl": "1.25rem", full: "9999px" }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 24px; }
        .verify-bg {
            background: linear-gradient(165deg, #0a0e17 0%, #0d1424 25%, #0f1930 50%, #0d1424 75%, #0a0e17 100%);
            background-size: 400% 400%;
            animation: gradient-slow 20s ease infinite;
        }
        @keyframes gradient-slow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .card-accent { height: 3px; background: linear-gradient(90deg, #0f62fe, #8b5cf6); }
        .btn-primary {
            background: linear-gradient(180deg, #0f62fe 0%, #0d4dca 100%);
            box-shadow: 0 4px 14px rgba(15, 98, 254, 0.35);
        }
        .btn-primary:hover { filter: brightness(1.05); }
    </style>
</head>
<body class="font-display min-h-screen">
    <div class="relative min-h-screen verify-bg flex flex-col">
        <main class="relative flex-1 flex flex-col items-center justify-center px-4 py-12 z-10">
            <div class="w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-white text-2xl sm:text-3xl font-bold tracking-tight mb-2">회원 검증</h1>
                    <p class="text-white/70 text-sm">명부 정보로 본인 확인 후, 이메일 로그인과 구글 로그인을 둘 다 사용할 수 있습니다.</p>
                </div>
                <div class="glass-card rounded-2xl overflow-hidden">
                    <div class="card-accent"></div>
                    <div class="p-8 space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">이름</label>
                            <input id="name" type="text" placeholder="명부에 등록된 이름"
                                class="w-full rounded-xl border-2 border-gray-200 dark:border-gray-600 bg-gray-50/50 dark:bg-gray-800/50 h-14 px-4 text-base text-gray-900 dark:text-white placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">생년월일</label>
                            <input id="birthDate" type="text" placeholder="8자리 (예: 19900101)" maxlength="8"
                                class="w-full rounded-xl border-2 border-gray-200 dark:border-gray-600 bg-gray-50/50 dark:bg-gray-800/50 h-14 px-4 text-base text-gray-900 dark:text-white placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">휴대폰 번호</label>
                            <input id="phone" type="text" placeholder="숫자만 입력" maxlength="11"
                                class="w-full rounded-xl border-2 border-gray-200 dark:border-gray-600 bg-gray-50/50 dark:bg-gray-800/50 h-14 px-4 text-base text-gray-900 dark:text-white placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">가입 시 사용한 이메일 <span class="text-gray-400 font-normal">(이미 이메일로 가입한 경우에만)</span></label>
                            <input id="signupEmail" type="email" placeholder="예: member@example.com"
                                class="w-full rounded-xl border-2 border-gray-200 dark:border-gray-600 bg-gray-50/50 dark:bg-gray-800/50 h-14 px-4 text-base text-gray-900 dark:text-white placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition" />
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">이메일로 먼저 가입하셨다면, 그때 쓴 이메일을 입력하면 구글 계정도 같은 회원으로 연동됩니다.</p>
                        </div>
                        <button id="verifyBtn" type="button"
                            class="btn-primary w-full rounded-xl h-14 px-6 text-base font-semibold text-white mt-6 flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-xl">verified_user</span>
                            검증하고 로그인하기
                        </button>
                        <p class="text-center text-xs text-gray-500 dark:text-gray-400 pt-2">
                            검증 실패 시 로그인되지 않으며, 입력 정보는 저장되지 않습니다.
                        </p>
                    </div>
                </div>
                <p class="text-center mt-6">
                    <button id="cancelBtn" type="button" class="text-white/70 hover:text-white text-sm font-medium underline">
                        로그아웃하고 로그인 화면으로
                    </button>
                </p>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/page-transition.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await requireAuth();
            if (!session) return;

            const profile = await getCurrentUserProfile();
            if (profile && profile.member_id) {
                smoothNavigate('main.html');
                return;
            }

            const nameInput = document.getElementById('name');
            const birthDateInput = document.getElementById('birthDate');
            const phoneInput = document.getElementById('phone');
            const signupEmailInput = document.getElementById('signupEmail');
            const verifyBtn = document.getElementById('verifyBtn');
            const cancelBtn = document.getElementById('cancelBtn');

            birthDateInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });
            phoneInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });

            verifyBtn.addEventListener('click', async () => {
                const name = nameInput.value.trim();
                const birthDate = birthDateInput.value.trim();
                const phone = phoneInput.value.trim();
                const signupEmail = signupEmailInput.value.trim() || null;

                if (!name || !birthDate || !phone) {
                    showError('이름, 생년월일, 휴대폰 번호를 모두 입력하세요.');
                    return;
                }
                if (birthDate.length !== 8) {
                    showError('생년월일 8자리를 입력하세요. (예: 19900101)');
                    return;
                }

                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<span class="inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span> 검증 중...';

                try {
                    await linkGoogleAccountToMember(name, birthDate, phone, signupEmail);
                    showSuccess('회원 검증이 완료되었습니다.');
                    setTimeout(() => smoothNavigate('main.html'), 600);
                } catch (error) {
                    showError(error.message || '회원 검증에 실패했습니다.');
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '<span class="material-symbols-outlined text-xl">verified_user</span> 검증하고 로그인하기';
                }
            });

            cancelBtn.addEventListener('click', async () => {
                await signOut();
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
