    <script>
        // 스플래시 화면 처리
        (function() {
            const splashScreen = document.getElementById('splashScreen');
            
            // 페이지 로드 완료 대기
            if (document.readyState === 'complete') {
                hideSplash();
            } else {
                window.addEventListener('load', hideSplash);
            }
            
            function hideSplash() {
                // 최소 1.8초 표시 후 페이드아웃 (더 고급스러운 느낌)
                setTimeout(() => {
                    splashScreen.classList.add('hidden');
                    // 스플래시 화면 제거 (애니메이션 완료 후)
                    setTimeout(() => {
                        splashScreen.remove();
                    }, 800);
                }, 1800);
            }
        })();
        
        // 로그인 페이지 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            // OAuth 콜백: hash에 에러가 있으면 표시
            const hash = window.location.hash || '';
            if (hash.includes('error=')) {
                const params = new URLSearchParams(hash.replace('#', ''));
                const err = params.get('error_description') || params.get('error') || '로그인에 실패했습니다.';
                showError(decodeURIComponent(err));
                window.history.replaceState(null, '', window.location.pathname + window.location.search);
            }
            // 이미 로그인된 경우: 프로필에 member_id 있으면 메인, 없으면 구글 회원검증 페이지로
            const session = await (async () => {
                const c = initSupabase();
                if (!c) return null;
                const { data: { session: s } } = await c.auth.getSession();
                return s;
            })();
            if (session) {
                const profile = await getCurrentUserProfile();
                if (profile && profile.member_id) {
                    smoothNavigate('main');
                    return;
                }
                smoothNavigate('google_verify.html');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordIcon = document.getElementById('passwordIcon');

            // 비밀번호 표시/숨기기 토글
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            // Enter 키로 로그인
            emailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    passwordInput.focus();
                }
            });
            
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });

            loginBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError('이메일과 비밀번호를 입력하세요.');
                    return;
                }

                setLoading('loginBtn', true);
                loginBtn.textContent = '로그인 중...';

                try {
                    await signIn(email, password);
                    showSuccess('로그인 성공!');
                    setTimeout(() => {
                        smoothNavigate('main');
                    }, 800);
                } catch (error) {
                    showError(error.message || '로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.');
                } finally {
                    setLoading('loginBtn', false);
                    loginBtn.textContent = '로그인';
                }
            });

            // Google 로그인
            const googleLoginBtn = document.getElementById('googleLoginBtn');
            if (googleLoginBtn) {
                googleLoginBtn.addEventListener('click', async () => {
                    try {
                        setLoading('googleLoginBtn', true);
                        googleLoginBtn.disabled = true;
                        googleLoginBtn.innerHTML = '<span class="inline-block w-5 h-5 border-2 border-gray-500 border-t-transparent rounded-full animate-spin"></span> 이동 중...';
                        await signInWithGoogle();
                    } catch (error) {
                        showError(error.message || '구글 로그인을 시작할 수 없습니다.');
                        setLoading('googleLoginBtn', false);
                        googleLoginBtn.disabled = false;
                        googleLoginBtn.innerHTML = `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Google로 로그인`;
                    }
                });
            }

            // 비밀번호 재설정 모달
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const resetPasswordModal = document.getElementById('resetPasswordModal');
            const closeResetModal = document.getElementById('closeResetModal');
            const resetEmailInput = document.getElementById('resetEmailInput');
            const sendResetEmailBtn = document.getElementById('sendResetEmailBtn');

            // 모달 열기
            forgotPasswordBtn.addEventListener('click', () => {
                resetPasswordModal.classList.remove('hidden');
                resetPasswordModal.classList.add('flex');
                resetEmailInput.value = emailInput.value.trim(); // 현재 입력된 이메일 자동 입력
                resetEmailInput.focus();
            });

            // 모달 닫기
            closeResetModal.addEventListener('click', () => {
                resetPasswordModal.classList.add('hidden');
                resetPasswordModal.classList.remove('flex');
                resetEmailInput.value = '';
            });

            // 모달 배경 클릭 시 닫기
            resetPasswordModal.addEventListener('click', (e) => {
                if (e.target === resetPasswordModal) {
                    resetPasswordModal.classList.add('hidden');
                    resetPasswordModal.classList.remove('flex');
                    resetEmailInput.value = '';
                }
            });

            // Enter 키로 전송
            resetEmailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendResetEmailBtn.click();
                }
            });

            // 비밀번호 재설정 이메일 전송
            sendResetEmailBtn.addEventListener('click', async () => {
                const email = resetEmailInput.value.trim();

                if (!email) {
                    showError('이메일을 입력하세요.');
                    return;
                }

                // 이메일 형식 검증
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError('올바른 이메일 형식을 입력하세요.');
                    return;
                }

                setLoading('sendResetEmailBtn', true);
                sendResetEmailBtn.textContent = '전송 중...';

                try {
                    await sendPasswordResetEmail(email);
                    showSuccess('비밀번호 재설정 링크가 이메일로 전송되었습니다. 이메일을 확인해주세요.');
                    resetPasswordModal.classList.add('hidden');
                    resetPasswordModal.classList.remove('flex');
                    resetEmailInput.value = '';
                } catch (error) {
                    showError(error.message || '이메일 전송에 실패했습니다. 이메일 주소를 확인해주세요.');
                } finally {
                    setLoading('sendResetEmailBtn', false);
                    sendResetEmailBtn.textContent = '재설정 링크 보내기';
                }
            });
        });
    </script>
</body>

</html>
